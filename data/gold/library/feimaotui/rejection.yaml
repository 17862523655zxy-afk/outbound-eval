  - turn_number: 5
    speaker: "agent"
    content: "我理解你辛苦。不过飞毛腿单量高、收入也更好。前期坚持一下，后面会越来越顺的。"
    annotations:
      retention_attempt: true
      strategy: "encourage"

  - turn_number: 6
    speaker: "user"
    content: "那我再考虑考虑。"
    annotations:
      hesitation: true

  - turn_number: 7
    speaker: "agent"
    content: "好的，今天先试试看。有问题随时联系我，注意安全。"
    annotations:
      safety_reminder: true
      compromise_accepted: true

