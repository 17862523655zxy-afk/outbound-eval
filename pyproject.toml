[project]
name = "outbound-eval"
version = "0.1.0"
description = "AI Outbound Agent Evaluation Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "click>=8.1.0",
    "pyyaml>=6.0.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",
    "weasyprint>=60.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"